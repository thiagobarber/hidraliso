<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de Segurança e Cookies</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Iframe de fundo visível */
    #bg-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Overlay escuro e sutil com blur */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      animation: fadeIn 0.25s ease-out;
    }

    /* Caixa do Modal */
    .modal-box {
      position: relative;
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
      animation: slideUp 0.25s ease-out;
    }

    /* Botão fechar (X) */
    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #f1f3f5;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 15px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #e9ecef;
      color: #000;
    }

    .modal-icon {
      font-size: 36px;
      margin-bottom: 12px;
      line-height: 1;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 0.88rem;
      color: #555;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    /* Botões de Ação */
    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s, opacity 0.2s;
      border: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-accept {
      background-color: #00c853;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
    }

    .btn-accept:hover {
      background-color: #00b34a;
    }

    .btn-decline {
      background-color: #f1f3f5;
      color: #495057;
    }

    .btn-decline:hover {
      background-color: #e9ecef;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Fundo com a página de destino -->
  <iframe id="bg-frame" src="https://ev.braip.com/campanhas/cpa/camyxlnr1" loading="eager"></iframe>

  <!-- Modal de Cookies -->
  <div class="overlay" id="cookieOverlay">
    <div class="modal-box">
      <button class="close-btn" onclick="fecharModal()" aria-label="Fechar">&times;</button>
      
      <div class="modal-icon"></div>
      <h3 class="modal-title">Controle de Privacidade</h3>
      <p class="modal-text">
        Utilizamos cookies essenciais para otimizar sua navegação e garantir a melhor experiência com nossos serviços.
      </p>

      <div class="btn-group">
        <button class="btn btn-decline" onclick="fecharModal()">Recusar</button>
        <button class="btn btn-accept" onclick="aceitarCookies()">Aceitar e Continuar</button>
      </div>
    </div>
  </div>

  <script>
    const destinoCTA = "https://ev.braip.com/campanhas/cpa/camyxlnr1";

    function aceitarCookies() {
      // Redireciona a janela principal para o link de afiliado
      window.top.location.href = destinoCTA;
    }

    function fecharModal() {
      // Fecha o modal e libera a visualização da página de fundo
      document.getElementById('cookieOverlay').style.display = 'none';
    }
  </script>

  <script defer src="https://presellfuga.lovable.app/tracker.js?site=fb05485c-c4d7-4911-be9a-170052c39f6a"></script>
</body>
</html>
